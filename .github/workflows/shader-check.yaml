name: Shader Check
on:
  push:
    paths:
      - 'plugins/*/data/**.effect'
      - 'build-aux/effect-to-hlsl.py'
      - '.github/workflows/shader-check.yaml'
  pull_request:
    paths:
      - 'plugins/*/data/**.effect'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fxc:
    name: Compile shaders with FXC 🪟
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile every entry point (ps_4_0 / vs_4_0, as OBS D3D11 does)
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe not found" }
          Write-Host "Using $($fxc.FullName)"
          $failed = 0
          foreach ($effect in Get-ChildItem plugins -Recurse -Filter *.effect) {
            $hlsl = Join-Path $env:RUNNER_TEMP "$($effect.BaseName).hlsl"
            $entries = (python build-aux/effect-to-hlsl.py $effect.FullName $hlsl).Split(' ')
            foreach ($e in $entries) {
              $profile = if ($e -like 'VS*') { 'vs_4_0' } else { 'ps_4_0' }
              & $fxc.FullName /nologo /T $profile /E $e /O3 /Fo NUL $hlsl
              if ($LASTEXITCODE -ne 0) { Write-Host "::error file=$($effect.Name)::$e failed to compile"; $failed++ }
              else { Write-Host "OK  $($effect.Name) $e ($profile)" }
            }
          }
          if ($failed) { throw "$failed shader entry point(s) failed" }
