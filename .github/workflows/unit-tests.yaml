name: Unit Tests
on:
  push:
    paths:
      - 'plugins/**'
      - '.github/workflows/unit-tests.yaml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Plugin tests 🧪
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet numpy scipy scikit-image
      - name: Run every plugin's tests/run-tests.sh
        run: |
          set -e
          for script in plugins/*/tests/run-tests.sh; do
            echo "::group::${script}"
            bash "${script}"
            echo "::endgroup::"
          done
