name: Unit Tests
on:
  push:
    paths:
      - 'plugins/**'
      - 'viewer/**'
      - 'research/foveation/squish_math.py'
      - 'research/foveation/starvation_math.py'
      - '.github/workflows/unit-tests.yaml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Plugin tests 🧪
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet numpy scipy scikit-image opencv-python-headless
      - name: Run every plugin's tests/run-tests.sh
        run: |
          set -e
          for script in plugins/*/tests/run-tests.sh; do
            echo "::group::${script}"
            bash "${script}"
            echo "::endgroup::"
          done
      - name: Viewer extension in headless Chromium
        run: |
          pip install --quiet playwright pillow
          python3 -m playwright install --with-deps chromium > /dev/null
          bash plugins/foveated-squish/tests/run-tests.sh --e2e
      - name: Package the viewer extension
        uses: actions/upload-artifact@v4
        with:
          name: dbpo-unsquish-extension
          path: |
            viewer/unsquish-extension
            !viewer/unsquish-extension/tests
