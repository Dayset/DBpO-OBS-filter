AtlasScale="Size in the strip"
AtlasHeader="\n\nSharp regions as streamed (reopen this window to refresh these numbers):"
AtlasRegionFull="\n  %s: full size, slot %dx%d px"
AtlasRegionScaled="\n  %s: %.0f%% size, slot %dx%d px"
AtlasRegionReduced="\n  %s: does not fit at %.0f%%, shown at %.0f%% (lowest allowed %.0f%%), slot %dx%d px"
AtlasNoFit="The sharp regions do not fit the strip even at their lowest allowed size. Make a region smaller, move it nearer the middle of the picture, or switch one off."
AtlasOverlap="Two sharp regions overlap. Move one so they do not share pixels."
AtlasSize="A sharp region is out of range. Left + width and top + height must stay inside the picture, and each side must be 2% to 50% of it."
AtlasCustom="Sharp regions need a standard stream resolution. They are not streamed with Custom squeeze."
Hint.atlas_on="Master switch. Off = the stream is exactly as without this feature (same size, same config string)."
Hint.atlas_blank="The region also appears in the squeezed picture, where it would cost bits twice. On = that spot is painted flat so the encoder spends almost nothing there. Viewers without the extension then see a flat patch. Recommended."
Hint.atlas_name="A label for the info text below. It is never sent to viewers."
Hint.atlas_preset="Fills in the four numbers below for a 20% corner. You can still adjust them afterwards."
Hint.atlas_x="Left edge of the region, as a percent of the game picture width."
Hint.atlas_y="Top edge of the region, as a percent of the game picture height."
Hint.atlas_w="Region width in percent of the picture width (2-50). Left + width must not pass 100."
Hint.atlas_h="Region height in percent of the picture height (2-50). Top + height must not pass 100."
Hint.atlas_scale="How large the region is drawn in the strip. 100 = as large as the stream allows, smaller saves strip space. The filter lowers it automatically if needed, never below the lowest size that still gives it half the detail of the middle."
LookBrightness="Brightness"
Unit.look_brightness=" %"
Hint.look_brightness="Makes the whole picture lighter (+) or darker (-). 0 = off. Sent to viewers; each viewer can change or switch it off."
LookContrast="Contrast"
Unit.look_contrast=" %"
Hint.look_contrast="Pushes light and dark apart (+) or flattens them (-). 0 = off. Sent to viewers; each viewer can change or switch it off."
LookGamma="Gamma"
Unit.look_gamma=" %"
Hint.look_gamma="Lifts (+) or lowers (-) the midtones without touching black and white. 0 = off. Sent to viewers; each viewer can change or switch it off."
LookSaturation="Saturation"
Unit.look_saturation=" %"
Hint.look_saturation="Stronger (+) or weaker (-) colours. -100 = grey. 0 = off. Sent to viewers; each viewer can change or switch it off."
LookVibrance="Vibrance"
Unit.look_vibrance=" %"
Hint.look_vibrance="Like saturation, but lifts dull colours more than colours that are already strong, so skin and bright effects do not blow out. 0 = off. Sent to viewers; each viewer can change or switch it off."
LookTemperature="Temperature"
Unit.look_temperature=" %"
Hint.look_temperature="Warmer (+, more orange) or cooler (-, more blue). 0 = off. Sent to viewers; each viewer can change or switch it off."
LookTint="Tint"
Unit.look_tint=" %"
Hint.look_tint="Shifts towards magenta (+) or green (-). 0 = off. Sent to viewers; each viewer can change or switch it off."
LookHue="Hue shift"
Unit.look_hue=" %"
Hint.look_hue="Rotates all colours around the colour wheel. 0 = off. Sent to viewers; each viewer can change or switch it off."
LookHighlights="Highlights"
Unit.look_highlights=" %"
Hint.look_highlights="Brightens (+) or tames (-) the bright parts only. 0 = off. Sent to viewers; each viewer can change or switch it off."
LookShadows="Shadows"
Unit.look_shadows=" %"
Hint.look_shadows="Opens up (+) or deepens (-) the dark parts only. 0 = off. Sent to viewers; each viewer can change or switch it off."
LookBw="Black and white"
Unit.look_bw=" %"
Hint.look_bw="Blends the picture to grey. 100 = fully black and white. 0 = off. Sent to viewers; each viewer can change or switch it off."
LookSepia="Sepia"
Unit.look_sepia=" %"
Hint.look_sepia="Blends to a warm brown old-photo tone. 0 = off. Sent to viewers; each viewer can change or switch it off."
LookNight="Night mode"
Unit.look_night=" %"
Hint.look_night="Cooler, dimmer look with lifted shadows. 0 = off. Sent to viewers; each viewer can change or switch it off."

Starve="Dynamic resolution when starved"
StarveInfo="When a busy scene needs more bitrate than your stream has, the picture shrinks inside the frame (rest black) instead of turning into blocks, and comes back when the scene calms down. Viewers need the DBpO Unsquish extension for this; without it they see a smaller picture in the corner during busy moments. Add sl=1 to the config (the Share box does this when this is on)."
StarveReadout="Now: level %s | demand / budget %.2f | budget %.0f kbit/s | network load %.0f%% (reopen this window to refresh)"
StarveLowest="Lowest allowed level"
Starve.720="720p"
Starve.540="540p"
Starve.360="360p"
StarveBitrate="Stream bitrate"
StarveSensitivity="Sensitivity"
StarveNetwork="React to network congestion"
StarveSquish="Squeeze edges harder while shrinking"
Hint.starve_on="Turn on to let the filter lower the picture size by itself in busy scenes. No stream restart, no OBS change."
Hint.starve_lowest="How small the picture may get. 360p looked good in tests; 270p and 180p are for very low bitrates and look soft, but still better than a picture full of blocks."
Hint.starve_bitrate="0 = read it from your streaming output (the video bitrate you set in OBS). Type a number only if that does not work or you want to test."
Hint.starve_sensitivity="Higher = drops resolution earlier. The default was fitted on PlanetSide 2 footage; tune it for your game."
Hint.starve_network="Also lowers the picture when OBS reports a congested connection or dropped frames."
Hint.starve_squish="When shrinking, squeeze the edges harder so the centre loses less. How much is possible depends on your squeeze settings: with a large sharp centre there is little room, and the filter then shrinks the picture evenly."
HotkeyForce1080="Starvation: force full size"
HotkeyForce720="Starvation: force 720p"
HotkeyForce540="Starvation: force 540p"
HotkeyForce360="Starvation: force 360p"
HotkeyAuto="Starvation: automatic"
Starve.270="270p"
Starve.180="180p"
StarveRampDown="Shrink time"
StarveRampUp="Grow-back time"
StarveDemo="Demo loop (ignores the detector)"
HotkeyDemo="Starvation: demo loop on/off"
Hint.starve_ramp_down="How long the picture takes to shrink when a busy scene starts. It moves in small steps (about 14 px at 1080p), so viewers with the extension see sharpness fade instead of jump. 0.5 s reacts fast; longer is smoother but holds the bigger picture while the stream is starved."
Hint.starve_ramp_up="How long the picture takes to grow back once the scene is calm. 2 s is hard to notice."
Hint.starve_demo="For showing the feature on stream: cycles full size, squeezed smaller, plain smaller, 360p and 360p squeezed, with 2 s transitions and 4 s holds. Also on a hotkey."
Advanced="Show advanced settings"
Hint.show_advanced="Off: only the settings that matter. On: also width/height split, center position, custom curve, edge limit, starvation tuning and config import. Hidden settings keep their values."
CurveStyle="Edge squeeze style"
CurveStyle.Sharp="Sharpest center (default)"
CurveStyle.Balanced="Balanced"
CurveStyle.Smooth="Smoothest edges"
CurveStyle.Custom="Custom curve (slider)"
Hint.curve_style="Where the squeeze happens. Sharpest center: everything outside the center is squeezed right away, so the center gets the most bits. Smoothest edges: a gradual ramp, the area around the center stays sharper but the center gets a little less."
