FoveatedSquish="Foveated Squish"
InfoDefault="Squeezes the edges (X and Y) so a fixed stream bitrate is spent on the sharp center. Viewers unfold it with the DBpO Unsquish browser extension."
InfoFill="Source %ux%u -> squeezed to fill your %ux%u canvas (%.0f%% x %.0f%%). Keep the canvas and output at %ux%u. The full-quality center can be at most ~%.0f%% wide at this squeeze. To sacrifice the edges more, use a smaller canvas (see the setup guide). Use View > Squeezed zone to see the result live. %s"
InfoFillSmall="NOT SQUEEZING: the source (%ux%u) must be larger than the canvas (%ux%u). Run the game at a higher resolution than the canvas (2560x1440 for a 1920x1080 canvas, e.g. with NVIDIA DLDSR 1.78x on a 1080p monitor), or use the Exact size layout. See the setup guide."
InfoExact="Source %ux%u -> streamed %ux%u (%.0f%% of the pixels). Set OBS Settings > Video > Base (Canvas) and Output resolution to %ux%u (you can type a custom size into those fields). Press Copy to update these numbers after moving the sliders. %s"
Clamped="(Squeeze limited by Max edge compression: raise it, or lower the curve or the sharp center size.)"
Reduced="(The curve, or if needed the center, is lowered automatically so this squeeze fits.)"
MaxCompression="Max edge compression (x:1). Higher allows stronger squeeze with harder curves; above ~16 the outermost edge smears"
Layout="Layout"
Layout.Fill="Fill the canvas (auto squeeze = canvas / source, best)"
Layout.Exact="Manual squeeze, exact size (set the canvas to the squished size)"
Link="Same settings for height"
SqueezeWidth="Streamed width (% of source)"
SqueezeHeight="Streamed height (% of source)"
CenterWidth="Full-quality center (% of the frame, untouched pixels)"
CenterHeight="Full-quality center, height (% of the frame)"
FocusX="Focus position, horizontal (%)"
FocusY="Focus position, vertical (%)"
CurveX="Curve (low = edges squeezed evenly right from the center; high = squeeze pushed to the far edges, limited by the squeeze)"
CurveY="Curve, vertical"
Prefilter="Area filter when squeezing (prevents edge shimmer)"
View="View"
View.Squished="Squished (what gets streamed)"
View.Unsquished="Unsquished preview (what extension viewers see)"
View.Zone="Squeezed zone (red = squeezed harder)"
Share="Share with viewers"
Config="Config string as of opening this window (Copy always copies the current one)"
Copy="Copy config to clipboard"
Import="Paste a config string to load it"
ApplyImport="Load pasted config"
