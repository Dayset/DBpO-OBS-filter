Hint.stream_resolution="The size of your stream, as set in OBS Settings > Video. Pick the one you actually stream at (720p is common for Twitch). Fix every CHANGE line in the checklist, then reopen this window."
Hint.same_for_y="On is fine for almost everyone. Turn off only if you want different settings for width and height."
Hint.squeeze_width="Only for a custom size: how much of the width is streamed. Lower = smaller stream but more squeeze."
Hint.squeeze_height="Only for a custom size: how much of the height is streamed."
Hint.center_width="How much of the middle stays at full sharpness. Start around 30%. Bigger = sharper area but harder squeeze at the edges. The slider stops at what your resolution allows."
Hint.center_height="Same as center size but for height (only when not linked)."
Hint.curve_x="Shape of the squeeze. 1 = gradual ramp. Low (0.1-0.5) = a hard step right at the center's edge. High = squeeze pushed to the far edges."
Hint.curve_y="Squeeze curve for height (only when not linked)."
Hint.clean_strength="Removes grass-like grain outside the center and keeps edges. 0 = off. Start around 20-30; 50 is the default. Higher is cleaner but flatter."
Hint.focus_x="Where the sharp center sits. 50% = middle of the screen. Move it only if your aim point is off-center."
Hint.focus_y="Vertical position of the sharp center. 50% = middle."
Hint.max_edge_compression="How hard the very edge may be squeezed. 12.5x is the default. Above 16x the outermost edge smears."
Hint.prefilter="Blurs slightly while squeezing so thin lines do not shimmer. Leave on."
Hint.view="Squished is what gets streamed. The other two are for checking only: Unsquished shows what viewers with the extension see, Squeezed zone shows the center (green) and the squeezed edge (red)."
Hint.config="Viewers paste this into the extension to unfold your stream. Copy it again after every change and put it in your stream title."
Hint.look_sharpen="Crisper edges for viewers with the extension. 0 = off. 20-40 is a good start."
Hint.look_clarity="Adds local contrast so detail pops. 0 = off. 20-30 is a good start."
Hint.look_hdr_toning="Brighter highlights and deeper shadows. 0 = off. Keep under 40 for a natural look."
Hint.look_bloom="Soft glow around bright areas. 0 = off. Keep low (10-20) unless you want a dreamy look."
Hint.look_sharpen_plus="Stronger adaptive sharpening. 0 = off. Use instead of Sharpen, not on top of it."
Hint.import="Paste a config string from another streamer, then press Load. This copies their squeeze settings."
Atlas="Keep sharp (HUD areas)"
AtlasInfo="Mark parts of the game picture (minimap, ammo, webcam) that must stay readable. They are copied almost 1:1 into a strip on the right of the stream (the squished picture takes the other 80% of the width) and viewers with the extension see them back in place. Steps: 1) switch this group on, 2) switch on a region and place it (Quick placement or the sliders), 3) check it with Preview > Squeezed zone, 4) Copy the config again. Needs a standard stream resolution, not Custom squeeze."
AtlasBlank="Hide the duplicate in the squeezed picture"
AtlasRegion="Region %d"
AtlasName="Name (only for you)"
AtlasPreset="Quick placement"
AtlasPreset.Pick="Pick a corner..."
AtlasPreset.TopLeft="Top-left corner, 20%"
AtlasPreset.TopRight="Top-right corner, 20%"
AtlasPreset.BottomLeft="Bottom-left corner, 20%"
AtlasPreset.BottomRight="Bottom-right corner, 20%"
AtlasLeft="Left edge"
AtlasTop="Top edge"
AtlasWidth="Width"
AtlasHeight="Height"
AtlasScale="Size in the strip"
AtlasHeader="\n\nSharp regions as streamed (reopen this window to refresh these numbers):"
AtlasRegionFull="\n  %s: full size, slot %dx%d px"
AtlasRegionScaled="\n  %s: %.0f%% size, slot %dx%d px"
AtlasRegionReduced="\n  %s: does not fit at %.0f%%, shown at %.0f%% (lowest allowed %.0f%%), slot %dx%d px"
AtlasNoFit="The sharp regions do not fit the strip even at their lowest allowed size. Make a region smaller, move it nearer the middle of the picture, or switch one off."
AtlasOverlap="Two sharp regions overlap. Move one so they do not share pixels."
AtlasSize="A sharp region is out of range. Left + width and top + height must stay inside the picture, and each side must be 2% to 50% of it."
AtlasCustom="Sharp regions need a standard stream resolution. They are not streamed with Custom squeeze."
Hint.atlas_on="Master switch. Off = the stream is exactly as without this feature (same size, same config string)."
Hint.atlas_blank="The region also appears in the squeezed picture, where it would cost bits twice. On = that spot is painted flat so the encoder spends almost nothing there. Viewers without the extension then see a flat patch. Recommended."
Hint.atlas_name="A label for the info text below. It is never sent to viewers."
Hint.atlas_preset="Fills in the four numbers below for a 20% corner. You can still adjust them afterwards."
Hint.atlas_x="Left edge of the region, as a percent of the game picture width."
Hint.atlas_y="Top edge of the region, as a percent of the game picture height."
Hint.atlas_w="Region width in percent of the picture width (2-50). Left + width must not pass 100."
Hint.atlas_h="Region height in percent of the picture height (2-50). Top + height must not pass 100."
Hint.atlas_scale="How large the region is drawn in the strip. 100 = as large as the stream allows, smaller saves strip space. The filter lowers it automatically if needed, never below the lowest size that still gives it half the detail of the middle."

