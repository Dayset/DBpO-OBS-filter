Hint.flatten="How strongly grain and noise are smoothed away while edges stay sharp. 0 = off. 50 is the measured sweet spot (try 30-70). Higher saves little more and starts to look waxy."
Hint.chroma_smoothing="Blends color blotches in smooth gradients like sky. Best left at 0: it can raise bitrate on grainy games. Try 20-40 only if you see color banding."
Hint.temporal_denoise="Averages frames together to remove grain. Helps only when the camera and scene are still (menus, spectating). Leave at 0 for fast games."
Hint.hold="Keeps last frame's pixel while it barely changes. Can cost bandwidth on slow camera moves. Leave at 0 unless a static scene still shimmers."
Hint.soften_edges="Blurs the sides so detail where nobody looks does not cost bits. Off by default. Check the area with View > Softened zone."
Hint.soften_strength="Blur radius at the very edge, in pixels. 2 is gentle, 4+ is obvious."
Hint.soften_center="How wide the untouched middle is. 30-50% is a good start."
Hint.soften_feather="How gradually the blur fades in from the center. Larger = less visible. 40% is a good start."
Hint.soften_vertical="Also blur the top and bottom, not just left and right. Leave off if your HUD sits there."
Hint.mode="Off is recommended. These looks reduce colors on purpose and make the stream need MORE bitrate. Use them for style, not to save bandwidth."
Hint.levels_lightness="Fewer = flatter, more cartoon-like. 96 is subtle, 32 is strong."
Hint.levels_chroma="Fewer = fewer distinct colors. 32 is subtle, 12 is strong."
Hint.palette_colors="How many colors the picture is limited to. 128 is subtle, 32 is obvious."
Hint.luma_protection="Higher keeps brightness detail at the cost of color accuracy. 1.0 is neutral."
Hint.dither="Adds a fixed pattern to hide color banding. It roughly doubles bitrate, so keep it None unless style matters more."
Hint.dither_strength="How strong the dither pattern is. 50% is a good start."
Hint.palette_update_every="How often the color palette is recalculated. 3 is a good start; higher is cheaper but slower to react."
Hint.palette_smoothing="Higher keeps colors steady between updates and avoids flicker. 80% is a good start."
Hint.scene_change="How big a change counts as a new scene (palette resets). 15% is a good start."
Hint.view="Result is what viewers get. Split compare shows the original on the left to judge the effect. These previews are only for checking."
