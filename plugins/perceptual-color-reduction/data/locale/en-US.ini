Soften="Soften the edges of the picture"
SoftenInfo="Blurs the sides while the center stays sharp: detail where nobody looks costs bits. Measured with x264: about -1% at typical quality, up to -14% at high quality on grainy footage. Check the zone with View > Softened zone."
