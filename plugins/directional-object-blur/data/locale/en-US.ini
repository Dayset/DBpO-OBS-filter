Hint.preset="Off = no blur. Subtle = light film look (good for most streams). Cinematic = long glowing streaks. Custom = every setting below."
Hint.strength="How long the blur is compared with how far things move each frame. 0.5 = natural film look, 1.0 = long smear. Above 2 looks stylized."
Hint.max_blur_radius="Hard cap on blur length so fast motion cannot smear across the screen. 24-32 is a good start."
Hint.opacity="Mix of the blurred result with the original. 100% = full effect, lower = subtler."
Hint.samples="Higher = smoother blur but more GPU use. 16-24 is plenty for most; 32+ only for long blurs."
Hint.object_sensitivity="Higher keeps differently colored objects from sharing one motion. 50 is a good start."
Hint.object_blur_type="Directional follows the movement. Non-directional just softens fast things. Directional is the natural choice."
Hint.area_strength="How soft fast-moving things get with non-directional blur. 1 is gentle."
Hint.glow_amount="Fast objects spread light around them. 0 = off. 20-50 is subtle."
Hint.glow_radius="How far the glow spreads. 24 px is a good start."
Hint.trail_mode="Leaves a fading ghost image behind movement. Off is the natural choice."
Hint.trail_length="How long trails take to fade. 50% is a good start."
Hint.dither="Adds fine grain to hide banding in long blurs. Grain is expensive to encode, so leave off unless you see banding."
Hint.camera_motion="Blurs the whole picture when you turn or move the camera, not just moving objects. Leave on for FPS games."
Hint.camera_strength="How strong camera blur is compared with object blur. 0.5-0.75 feels natural."
Hint.camera_smoothing="Higher = steadier blur direction but slower reaction. 0.5 is a good start."
Hint.object_threshold="How far a region must move against the camera to count as its own object. 2 px is a good start."
Hint.camera_speed_min="Turning slower than this gets no blur. 2 px/frame is a good start."
Hint.camera_speed_full="Turning at this speed or faster gets full blur. 12 px/frame is a good start."
Hint.camera_response_curve="Below 1 blur builds up early, above 1 only fast swings blur. 1 is even."
Hint.shutter_phase="0 = blur trails behind the moving thing, like a real camera. 100 = centered on it, like many games. 0 is recommended."
Hint.tail_fade="Makes the older part of the smear fade out for a comet look. 0 = even smear."
Hint.highlight_streaks="Bright lights keep their brightness when smeared. 0 = off, 50 = film-like."
Hint.ui_protect="Keeps the HUD, minimap frame and menus sharp. Leave on."
Hint.ui_sensitivity="How readily still areas count as HUD. 50 is a good start. Check with Preview > Protected UI."
Hint.ui_margin="Grows the protected area around the HUD. 6 px is a good start."
Hint.mouse_input="Reads mouse movement (no clicks or keys) to blur turns that are too fast to see in the image. Windows only. Off by default."
Hint.mouse_mode="Fast turns only is recommended: the picture handles normal movement, the mouse covers extreme speed."
Hint.mouse_calibration="Automatic learns the mouse scale while you play for about 10 seconds. Use Manual only if automatic fails."
Hint.mouse_gain_x="Screen pixels per mouse count, horizontal. Only used in Manual calibration."
Hint.mouse_gain_y="Screen pixels per mouse count, vertical. Only used in Manual calibration."
Hint.mouse_latency="How many frames the mouse leads the picture. Only used in Manual calibration. Usually 1-2."
Hint.lookahead_frames="Waits a few frames so the blur knows where things go next: smoother and cleaner, but the video is late. 0 = no delay (recommended unless you add audio sync offset)."
Hint.clear_shape="Keeps a spot in the center free of blur, for your crosshair. Off is fine for most."
Hint.clear_size="Size of the sharp spot as a share of the frame height. 25% is a good start."
Hint.clear_feather="How softly the sharp spot blends into the blur. 20% is a good start."
Hint.flow_downscale="Resolution used to detect motion. 1/4 is balanced. 1/8 is cheaper, 1/2 is more precise but slower."
Hint.search_radius="How far the search looks for motion. Higher catches faster motion at more GPU cost. 4 is a good start."
Hint.coherence_radius="How strongly nearby pixels of the same color share motion. 2 is a good start."
Hint.min_motion="Movement smaller than this is ignored, which cuts shimmer. 1 px is a good start."
Hint.static_bias="Higher ignores more noise but can miss slow movement. 0.08 is a good start."
Hint.view="Result is what viewers get. The others show how motion is detected and are for troubleshooting only."
